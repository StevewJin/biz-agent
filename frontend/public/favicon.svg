<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- antenna -->
  <line x1="32" y1="2" x2="32" y2="10" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="2" r="3" fill="#a78bfa"/>

  <!-- head -->
  <rect x="10" y="14" width="44" height="36" rx="8" fill="#7c3aed"/>

  <!-- ears -->
  <rect x="4" y="24" width="10" height="16" rx="3" fill="#6d28d9"/>
  <rect x="50" y="24" width="10" height="16" rx="3" fill="#6d28d9"/>

  <!-- face plate -->
  <rect x="16" y="20" width="32" height="24" rx="5" fill="#ede9fe"/>

  <!-- eyes -->
  <circle cx="26" cy="30" r="4" fill="#7c3aed"/>
  <circle cx="38" cy="30" r="4" fill="#7c3aed"/>
  <circle cx="27" cy="29" r="1.5" fill="#c4b5fd"/>
  <circle cx="39" cy="29" r="1.5" fill="#c4b5fd"/>

  <!-- mouth -->
  <rect x="24" y="38" width="16" height="3" rx="1.5" fill="#c4b5fd"/>
  <rect x="27" y="37" width="3" height="1.5" rx="0.75" fill="#a78bfa"/>
  <rect x="34" y="37" width="3" height="1.5" rx="0.75" fill="#a78bfa"/>
</svg>
